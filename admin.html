<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulso · Organizador</title>
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
  <div class="wrap-wide">
    <div class="row" style="margin-bottom:16px">
      <div class="brand" style="margin:0"><span class="dot"></span><h1>Pulso · Organizador</h1></div>
      <div class="spacer"></div>
      <span id="modo" class="small muted"></span>
    </div>

    <!-- Puerta de acceso -->
    <div id="gate" class="card" style="max-width:360px">
      <p style="margin:0 0 10px;font-weight:500">Acceso al panel</p>
      <input type="password" id="pass" placeholder="Clave del organizador">
      <button id="entrar" class="btn-primary" style="width:100%;margin-top:10px">Entrar</button>
      <p id="gate-err" class="small" style="color:#a32d2d;margin:8px 0 0"></p>
    </div>

    <!-- Panel -->
    <div id="panel" class="hidden">
      <div class="card" style="margin-bottom:16px">
        <p style="margin:0 0 4px;font-weight:500">Preguntas de la partida</p>
        <p class="small muted" style="margin:0 0 12px">Toca una pregunta para iniciar su ronda (20 segundos de votación).</p>
        <div id="lista-sesiones" class="chips"></div>
      </div>

      <div id="activa-zona" class="hidden">
        <div class="admin-cols">
          <div>
            <div class="row" style="justify-content:space-between;align-items:flex-start;margin-bottom:14px">
              <div style="flex:1;min-width:0">
                <p class="small muted" style="margin:0">Pregunta activa</p>
                <p id="activa-txt" style="font-size:18px;font-weight:600;margin:2px 0 0"></p>
              </div>
              <div class="timer" id="admin-timer">20</div>
            </div>

            <div class="lead">
              <div id="lead-face"></div>
              <div>
                <p id="lead-label" style="font-size:16px;font-weight:500;margin:0"></p>
                <p class="small muted" style="margin:2px 0 0"><b id="total-votos">0</b> votos</p>
              </div>
            </div>

            <div id="chart" class="chart"></div>

            <div class="row" style="margin-top:16px">
              <button id="reiniciar">Reiniciar 20s</button>
              <button id="cerrar">Cerrar ronda</button>
              <button id="exportar">Exportar PDF</button>
            </div>
          </div>

          <div class="qr-box">
            <div id="qr"></div>
            <p class="small" style="font-weight:500;margin:0 0 2px">QR para los participantes</p>
            <p class="small muted" id="qr-url" style="margin:0 0 10px;word-break:break-all"></p>
            <a href="proyectar.html" target="_blank" rel="noopener"><button style="width:100%">Abrir pantalla de proyección</button></a>
            <p class="small muted" style="margin:8px 0 0">Pantalla pública sin contraseña, para proyectar el QR.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/character.js?v=4"></script>
  <script src="js/store.js?v=4"></script>
  <script src="js/admin.js?v=4"></script>
</body>
</html>
