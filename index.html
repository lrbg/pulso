<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Pulso</title>
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="dot"></span><h1>Pulso</h1></div>

    <!-- Estado: esperando ronda -->
    <div id="espera" class="card center hidden">
      <div class="face-stage" id="espera-face"></div>
      <p class="muted" id="espera-msg">Espera a que el organizador inicie una pregunta.</p>
    </div>

    <!-- Estado: votando -->
    <div id="votar" class="hidden">
      <div class="timer-wrap"><div class="timer" id="timer">20</div></div>
      <p class="pregunta" id="pregunta-txt"></p>
      <div id="opciones" class="opciones"></div>
    </div>

    <!-- Estado: ya votó -->
    <div id="votado" class="card center hidden">
      <div class="face-stage" id="votado-face"></div>
      <p id="votado-msg" style="font-size:16px;font-weight:500;margin:6px 0 2px"></p>
      <p class="small muted">Espera la siguiente pregunta…</p>
    </div>

    <!-- Estado: se acabó el tiempo (sin votar) -->
    <div id="tiempo" class="card center hidden">
      <div class="face-stage" id="tiempo-face"></div>
      <p style="font-size:16px;font-weight:500;margin:6px 0 2px">Se acabó el tiempo</p>
      <p class="small muted">Espera la siguiente pregunta…</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/character.js?v=4"></script>
  <script src="js/store.js?v=4"></script>
  <script src="js/participant.js?v=4"></script>
</body>
</html>
